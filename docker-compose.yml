services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_AUTO_REMEDIATE: "true"
    volumes:
      - /:/var/lib/sentinel/evidence
    depends_on: [redis]
  worker:
    build: .
    command: python -m workers.remediation_worker
    privileged: true
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
  redis:
    image: redis:7
    ports:
      - "6379:6379"
