apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel
  namespace: sentinel
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/platform-remediation
---
# The agent's run_diagnostic tool uses kubectl to inspect compromised workloads
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinel-cluster-admin
subjects:
  - kind: ServiceAccount
    name: sentinel
    namespace: sentinel
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
